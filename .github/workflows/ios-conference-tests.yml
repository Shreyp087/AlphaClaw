name: iOS Conference Tests

on:
  push:
    paths:
      - ".github/workflows/ios-conference-tests.yml"
      - "samples/CameraAccess/**"
  pull_request:
    paths:
      - ".github/workflows/ios-conference-tests.yml"
      - "samples/CameraAccess/**"
  workflow_dispatch:

concurrency:
  group: ios-conference-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conference-tests:
    runs-on: macos-15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare local secrets stub
        run: |
          cp samples/CameraAccess/CameraAccess/Secrets.swift.example \
             samples/CameraAccess/CameraAccess/Secrets.swift

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess

      - name: Create simulator for CI
        id: simulator
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def simctl_json(*args):
              cmd = ["xcrun", "simctl", *args, "-j"]
              return json.loads(subprocess.check_output(cmd, text=True))

          def parse_version(value):
              return tuple(int(part) for part in re.findall(r"\d+", value))

          runtimes = simctl_json("list", "runtimes", "available").get("runtimes", [])
          ios_runtimes = [
              runtime for runtime in runtimes
              if runtime.get("isAvailable", False)
              and (
                  runtime.get("platform") == "iOS"
                  or "iOS" in runtime.get("identifier", "")
              )
          ]
          if not ios_runtimes:
              sys.exit("No available iOS simulator runtimes found on the runner.")

          runtime = max(
              ios_runtimes,
              key=lambda item: parse_version(item.get("version", item.get("name", ""))),
          )
          runtime_id = runtime["identifier"]

          device_types = simctl_json("list", "devicetypes").get("devicetypes", [])
          preferred_types = [
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
          ]
          available_type_ids = {device["identifier"] for device in device_types}
          device_type_id = next(
              (identifier for identifier in preferred_types if identifier in available_type_ids),
              None,
          )
          if device_type_id is None:
              fallback = next(
                  (device for device in device_types if device.get("name", "").startswith("iPhone")),
                  None,
              )
              if fallback is None:
                  sys.exit("No iPhone simulator device types are available on the runner.")
              device_type_id = fallback["identifier"]

          device_name = "CameraAccess CI"
          devices_by_runtime = simctl_json("list", "devices", runtime_id).get("devices", {})
          runtime_devices = devices_by_runtime.get(runtime_id, [])
          existing = next((device for device in runtime_devices if device.get("name") == device_name), None)

          if existing:
              udid = existing["udid"]
          else:
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", device_name, device_type_id, runtime_id],
                  text=True,
              ).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"runtime_id={runtime_id}", file=output)
              print(f"device_type_id={device_type_id}", file=output)
              print(f"udid={udid}", file=output)

          print(f"Using simulator UDID: {udid}")
          print(f"Using runtime: {runtime_id}")
          print(f"Using device type: {device_type_id}")
          PY

      - name: Boot simulator for CI
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run conference-mode unit tests
        run: |
          xcodebuild test \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:CameraAccessTests/ConferenceModeTests \
            CODE_SIGNING_ALLOWED=NO
